services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définis MYSQL_ROOT_PASSWORD dans le fichier .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-projet_spe_4}
      MYSQL_USER: ${MYSQL_USER:-projet_spe_4}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Définis MYSQL_PASSWORD dans le fichier .env}
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./api/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-projet_spe_4}
      DB_USER: ${MYSQL_USER:-projet_spe_4}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Définis MYSQL_PASSWORD dans le fichier .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?Définis JWT_SECRET dans le fichier .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - ./api:/app/api
    depends_on:
      mysql:
        condition: service_healthy

  realtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      INTERNAL_API_URL: http://api:3000
    ports:
      - '${REALTIME_PORT:-3001}:3001'
    volumes:
      - ./realtime:/app/realtime
    depends_on:
      - api

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - api
      - realtime

volumes:
  mysql_data:
